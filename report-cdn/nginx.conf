proxy_cache_path /var/cache/nginx/reports
                 levels=1:2
                 keys_zone=reports_cache:20m
                 max_size=1g
                 inactive=7d
                 use_temp_path=off;

server {
    listen 8080;
    server_name report-cdn;

    location /reports/ {
        proxy_pass http://minio:9000/bionicpro-reports/reports/;
        proxy_http_version 1.1;

        proxy_set_header Host minio:9000;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_cache reports_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key $uri;

        # Одновременные запросы одного отсутствующего объекта
        # не должны все уходить в MinIO.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;

        proxy_cache_valid 200 24h;
        proxy_cache_valid 404 30s;

        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;

        # Браузерный кеш короткий, основной кеш находится в CDN Nginx.
        add_header Cache-Control "private, max-age=300" always;
    }
}