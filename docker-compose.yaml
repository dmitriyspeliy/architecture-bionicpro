x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: bionicpro-airflow:3.2.2

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow_db:5432/airflow"

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow_api_server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow

    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    TELEMETRY_DB_HOST: telemetry_db
    TELEMETRY_DB_PORT: "5432"
    TELEMETRY_DB_NAME: bionicpro_telemetry
    TELEMETRY_DB_USERNAME: bionicpro_telemetry
    TELEMETRY_DB_PASSWORD: ${TELEMETRY_DB_PASSWORD}

    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "8123"
    CLICKHOUSE_DATABASE: reports_olap
    CLICKHOUSE_USERNAME: reports
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins

  user: "${AIRFLOW_UID:-50000}:0"
services:
  airflow_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U airflow -d airflow
      interval: 5s
      timeout: 5s
      retries: 15

  airflow_init:
    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    command: version
    user: "0:0"
    depends_on:
      airflow_db:
        condition: service_healthy

  airflow_api_server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8088:8080"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8080/api/v2/monitor/health
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow_db:
        condition: service_healthy
      airflow_init:
        condition: service_completed_successfully

  airflow_scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow_db:
        condition: service_healthy
      airflow_init:
        condition: service_completed_successfully

  airflow_dag_processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow_db:
        condition: service_healthy
      airflow_init:
        condition: service_completed_successfully
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  crm_cdc_init:
    image: postgres:14-alpine

    environment:
      CRM_DB_PASSWORD: ${CRM_DB_PASSWORD}
      CRM_CDC_USERNAME: ${CRM_CDC_USERNAME}
      CRM_CDC_PASSWORD: ${CRM_CDC_PASSWORD}

    volumes:
      - ./crm/cdc/01_cdc_setup.sql:/scripts/01_cdc_setup.sql:ro

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        until pg_isready \
          -h crm_db \
          -p 5432 \
          -U bionicpro_crm \
          -d bionicpro_crm
        do
          echo "Waiting for CRM database..."
          sleep 2
        done

        PGPASSWORD="$$CRM_DB_PASSWORD" \
        psql \
          -h crm_db \
          -p 5432 \
          -U bionicpro_crm \
          -d bionicpro_crm \
          -v cdc_user="$$CRM_CDC_USERNAME" \
          -v cdc_password="$$CRM_CDC_PASSWORD" \
          -f /scripts/01_cdc_setup.sql

        echo "CRM CDC configuration initialized"

    depends_on:
      crm_db:
        condition: service_healthy

  crm_db:
    image: postgres:14-alpine

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_slot_wal_keep_size=1GB
      - -c
      - hba_file=/etc/postgresql/custom-pg-hba.conf

    environment:
      POSTGRES_DB: bionicpro_crm
      POSTGRES_USER: bionicpro_crm
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD}

    ports:
      - "5435:5432"

    volumes:
      - crm-db-data:/var/lib/postgresql/data
      - ./crm/init:/docker-entrypoint-initdb.d:ro
      - ./crm/postgres/pg_hba.conf:/etc/postgresql/custom-pg-hba.conf:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U bionicpro_crm -d bionicpro_crm
      interval: 5s
      timeout: 5s
      retries: 15

  telemetry_db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: bionicpro_telemetry
      POSTGRES_USER: bionicpro_telemetry
      POSTGRES_PASSWORD: ${TELEMETRY_DB_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - telemetry-db-data:/var/lib/postgresql/data
      - ./telemetry/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U bionicpro_telemetry -d bionicpro_telemetry
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_DB: reports_olap
      CLICKHOUSE_USER: reports
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config.d/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - >
          clickhouse-client
          --user reports
          --password "$${CLICKHOUSE_PASSWORD}"
          --query "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET}
      LDAP_BIND_CREDENTIAL: ${LDAP_BIND_CREDENTIAL}

    command:
      - start-dev
      - --import-realm

    volumes:
      - ./keycloak/keycloak-results-export.json:/opt/keycloak/data/import/keycloak-results-export.json:ro

    ports:
      - "8080:8080"

    depends_on:
      - keycloak_db
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - report_cdn
  auth_db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: bionicpro_auth
      POSTGRES_USER: bionicpro_auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U bionicpro_auth -d bionicpro_auth
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: quay.io/minio/minio:latest
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 20

  minio_init:
    image: quay.io/minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local \
          http://minio:9000 \
          "$$MINIO_ROOT_USER" \
          "$$MINIO_ROOT_PASSWORD"
        do
          echo "Waiting for MinIO..."
          sleep 2
        done

        mc mb \
          --ignore-existing \
          "local/$$MINIO_BUCKET"

        mc anonymous set \
          download \
          "local/$$MINIO_BUCKET"

        echo "MinIO bucket initialized"
    depends_on:
      minio:
        condition: service_healthy

  kafka:
    image: quay.io/debezium/kafka:3.4
    hostname: kafka

    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      NODE_ID: "1"
      NODE_ROLE: combined

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: >-
        PLAINTEXT://0.0.0.0:9092,
        CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        PLAINTEXT:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

    expose:
      - "9092"

    volumes:
      - kafka-data:/kafka/data
      - kafka-logs:/kafka/logs

    healthcheck:
      test:
        - CMD-SHELL
        - >
          /kafka/bin/kafka-topics.sh
          --bootstrap-server kafka:9092
          --list
          >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  debezium_connect:
    image: quay.io/debezium/connect:3.4

    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: bionicpro-connect-cluster

      CONFIG_STORAGE_TOPIC: bionicpro_connect_configs
      OFFSET_STORAGE_TOPIC: bionicpro_connect_offsets
      STATUS_STORAGE_TOPIC: bionicpro_connect_statuses

      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

    ports:
      - "8083:8083"

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:8083/connectors >/dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

    depends_on:
      kafka:
        condition: service_healthy
      crm_cdc_init:
        condition: service_completed_successfully

  report_cdn:
    image: nginx:1.31.2-alpine
    expose:
      - "8080"
    volumes:
      - ./report-cdn/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - report-cdn-cache:/var/cache/nginx
    depends_on:
      minio:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
  openldap:
    image: osixia/openldap:1.5.0
    command:
      - --copy-service
    environment:
      LDAP_ORGANISATION: BionicPRO
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      LDAP_CONFIG_PASSWORD: ${LDAP_CONFIG_PASSWORD}
      LDAP_TLS: "false"
    ports:
      - "389:389"
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bionicpro.ldif:ro
      - ./ldap-data:/var/lib/ldap
      - ./ldap-config:/etc/ldap/slapd.d
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auth-db-data:
  crm-db-data:
  telemetry-db-data:
  clickhouse-data:
  airflow-db-data:
  minio-data:
  report-cdn-cache:
  kafka-data:
  kafka-logs:

