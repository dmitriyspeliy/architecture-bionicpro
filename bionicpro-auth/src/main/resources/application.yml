server:
  port: 8081
  forward-headers-strategy: framework

  servlet:
    session:
      timeout: 30m
      cookie:
        name: BIONICPRO_SESSION
        http-only: true
        secure: false
        same-site: lax

spring:
  application:
    name: bionicpro-auth

  datasource:
    url: jdbc:postgresql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:5434}/${AUTH_DB_NAME:bionicpro_auth}
    username: ${AUTH_DB_USERNAME:bionicpro_auth}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  session:
    store-type: redis
    redis:
      namespace: bionicpro:session

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s

  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:bionicpro-auth}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:bionicpro-auth-secret}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/reports-realm}
            user-name-attribute: preferred_username

bionicpro:
  services:
    reports:
      base-url: ${REPORTS_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}